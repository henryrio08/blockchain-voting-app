name: Capture demo screenshots

on:
  push:
    branches: [portfolio/demo-readme]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/demo-readme
          submodules: recursive
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.foundry/bin/foundryup"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          cd frontend
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start a local chain and deploy a demo election
        run: |
          anvil --host 127.0.0.1 > /tmp/anvil.log 2>&1 &
          for attempt in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          export PRIVATE_KEY="$(grep -Eo '0x[0-9a-fA-F]{64}' /tmp/anvil.log | head -n 1)"
          test -n "$PRIVATE_KEY"
          forge script script/DeployVoting.s.sol:DeployVoting --broadcast --rpc-url http://127.0.0.1:8545
          address=$(python - <<'PY'
          import json
          with open("broadcast/DeployVoting.s.sol/31337/run-latest.json") as f:
              data = json.load(f)
          for tx in data.get("transactions", []):
              if tx.get("transactionType") == "CREATE" and tx.get("contractName") == "Voting":
                  print(tx["contractAddress"])
                  break
          PY
          )
          test -n "$address"
          {
            echo "VITE_RPC_URL=http://127.0.0.1:8545"
            echo "VITE_CHAIN_ID=31337"
            echo "VITE_CONTRACT_ADDRESS=$address"
          } > frontend/.env.local

      - name: Capture screenshots and demo GIF
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/voting-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 2
          done
          node ../scripts/capture-demo.mjs
          video=$(find /tmp/voting-video -name '*.webm' -print -quit)
          test -n "$video"
          ffmpeg -y -i "$video" -vf "fps=8,scale=900:-1:flags=lanczos" -loop 0 ../docs/images/blockchain-voting-demo.gif

      - name: Commit screenshots and GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png docs/images/*.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add screenshots and demo GIF"
          git push origin portfolio/demo-readme
